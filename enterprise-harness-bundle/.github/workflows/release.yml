# Tag-triggered release with an SBOM and build provenance attestation.

name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest
        run: |
          test -f manifest.yaml
          grep -E '^version:\s+"?'"${GITHUB_REF_NAME#v}"'"?\s*$' manifest.yaml

      - name: Scan for invisible and bidirectional Unicode
        run: node scripts/scan-unicode.mjs .

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            manifest.yaml
            sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            manifest.yaml
            sbom.cdx.json
