name: Tests

# The 458-test suite had no CI job at all: it ran only when a maintainer ran it
# by hand, and on Windows it failed 45 assertions for platform reasons, so in
# practice it ran nowhere. This job is what makes `npm test` a real gate, and
# it is what justifies the handful of tests that skip on Windows — Linux is
# where they execute for real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tmux and jq gate real assertions via skipIf(). Without them the suite
      # still passes, but silently covers less than it appears to.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      # tests/workflows/* shell out to `gh aw compile`. The version must match
      # gh_aw_schema_version in docs/_meta/registry.yaml, because compiling
      # with a different one rewrites every committed .lock.yml.
      - name: Install gh-aw at the pinned version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.86.2

      - name: Run the suite
        run: npm test
