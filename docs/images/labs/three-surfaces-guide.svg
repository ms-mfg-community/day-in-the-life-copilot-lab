<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="three-surfaces-title three-surfaces-desc">
  <title id="three-surfaces-title">The three surfaces: OS Terminal, Copilot CLI and VS Code</title>
  <desc id="three-surfaces-desc">Three panels side by side show where you type in the labs. Panel 1, the OS Terminal, has a shell prompt that is a dollar sign in Bash or PS greater-than in PowerShell, and runs commands such as git, dotnet, gh and copilot --version. Typing copilot there starts an interactive session. Panel 2, Copilot CLI, is that session: its prompt is copilot greater-than and it takes slash commands such as /agent, /skills, /instructions, /env and /diagnose, plus plain-English prompts; /exit returns to the shell. Panel 3, VS Code, is the editor, where you create and save .github files, and the Copilot Chat view, where you pick a custom agent, type /skill-name, and open Chat: Open Customizations, Show Agent Debug Logs and Show Chat Debug View. A bottom strip shows the hop from the shell into a session and back, and notes that the badge names what you type into, not the window it sits in.</desc>
  <style>
    .bg{fill:#0d1117}
    .panel{fill:#161b22;stroke:#30363d;stroke-width:2}
    .win{fill:#0b0f14;stroke:#30363d;stroke-width:2}
    .sep{stroke:#30363d;stroke-width:2}
    .hi{stroke-width:2}
    .h1{font:700 34px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .h2{font:700 30px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .sub{font:400 20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .t{font:400 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tb{font:700 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tm{font:400 16px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .m{font:500 18px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .ms{font:500 16px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .pg{fill:#3fb950}
    .pp{fill:#bc8cff}
    .pb{fill:#58a6ff}
    .cm{fill:#8b949e}
    .badge{fill:#e3b341;stroke:#0d1117;stroke-width:2}
    .bn{font:700 17px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0d1117;text-anchor:middle}
    .chip{fill:#161b22;stroke-width:2}
  </style>

  <rect class="bg" width="1600" height="900"/>

  <text class="h1" x="40" y="62">Three surfaces, three prompts: know where you are typing</text>
  <text class="sub" x="40" y="96">Every lab step carries a badge. Match the badge to the prompt before you press Enter.</text>

  <!-- Panel 1: OS Terminal -->
  <rect class="panel" x="40" y="120" width="480" height="610" rx="14"/>
  <rect x="40" y="120" width="480" height="8" rx="4" fill="#3fb950"/>
  <text class="h2" x="64" y="166">🐚 In your OS Terminal</text>
  <text class="sub" x="64" y="196">Bash ($) or PowerShell (PS&gt;)</text>
  <line class="sep" x1="40" y1="212" x2="520" y2="212"/>
  <rect class="win" x="64" y="228" width="432" height="300" rx="8"/>
  <circle cx="86" cy="248" r="5" fill="#f85149"/><circle cx="104" cy="248" r="5" fill="#d29922"/><circle cx="122" cy="248" r="5" fill="#3fb950"/>
  <text class="tm" x="142" y="253">bash or pwsh</text>
  <text class="m" x="84" y="294"><tspan class="pg">$ </tspan>git status --short</text>
  <text class="m" x="84" y="330"><tspan class="pg">$ </tspan>dotnet build</text>
  <text class="m" x="84" y="366"><tspan class="pg">$ </tspan>gh auth status</text>
  <text class="m" x="84" y="402"><tspan class="pg">PS&gt; </tspan>Get-ChildItem .github/agents</text>
  <text class="m" x="84" y="438"><tspan class="pg">$ </tspan>copilot --version</text>
  <rect class="hi" x="76" y="460" width="408" height="44" rx="6" fill="#12261a" stroke="#3fb950"/>
  <text class="m" x="92" y="489"><tspan class="pg">$ </tspan>copilot</text>
  <text class="tm" x="250" y="489">starts a session</text>
  <circle class="badge" cx="472" cy="288" r="14"/><text class="bn" x="472" y="294">1</text>
  <circle class="badge" cx="472" cy="482" r="14"/><text class="bn" x="472" y="488">2</text>
  <circle class="badge" cx="86" cy="566" r="14"/><text class="bn" x="86" y="572">1</text>
  <text class="t" x="110" y="572">Prompt is $ or PS&gt;: it is your shell.</text>
  <circle class="badge" cx="86" cy="604" r="14"/><text class="bn" x="86" y="610">2</text>
  <text class="t" x="110" y="610">copilot opens a session: go to panel 2.</text>
  <text class="tb" x="64" y="656">Typical here</text>
  <text class="t" x="64" y="684">dotnet, git, gh, ls, cat, copilot --version</text>
  <text class="tm" x="64" y="710">Slash commands such as /agent do not work here.</text>

  <!-- Panel 2: Copilot CLI -->
  <rect class="panel" x="560" y="120" width="480" height="610" rx="14"/>
  <rect x="560" y="120" width="480" height="8" rx="4" fill="#bc8cff"/>
  <text class="h2" x="584" y="166">🤖 In Copilot CLI</text>
  <text class="sub" x="584" y="196">an interactive copilot&gt; session</text>
  <line class="sep" x1="560" y1="212" x2="1040" y2="212"/>
  <rect class="win" x="584" y="228" width="432" height="300" rx="8"/>
  <circle cx="606" cy="248" r="5" fill="#f85149"/><circle cx="624" cy="248" r="5" fill="#d29922"/><circle cx="642" cy="248" r="5" fill="#3fb950"/>
  <text class="tm" x="662" y="253">copilot session</text>
  <text class="m" x="604" y="294"><tspan class="pp">copilot&gt; </tspan>/agent planner</text>
  <text class="m" x="604" y="328"><tspan class="pp">copilot&gt; </tspan>/skills list</text>
  <text class="m" x="604" y="362"><tspan class="pp">copilot&gt; </tspan>/instructions</text>
  <text class="m" x="604" y="396"><tspan class="pp">copilot&gt; </tspan>/env</text>
  <text class="m" x="604" y="430"><tspan class="pp">copilot&gt; </tspan>/diagnose</text>
  <text class="m" x="604" y="464"><tspan class="pp">copilot&gt; </tspan>Add a student search page</text>
  <rect class="hi" x="596" y="480" width="408" height="38" rx="6" fill="#221a33" stroke="#bc8cff"/>
  <text class="m" x="612" y="506"><tspan class="pp">copilot&gt; </tspan>/exit</text>
  <text class="tm" x="800" y="506">back to the shell</text>
  <circle class="badge" cx="992" cy="288" r="14"/><text class="bn" x="992" y="294">3</text>
  <circle class="badge" cx="992" cy="500" r="14"/><text class="bn" x="992" y="506">4</text>
  <circle class="badge" cx="606" cy="566" r="14"/><text class="bn" x="606" y="572">3</text>
  <text class="t" x="630" y="572">Prompt is copilot&gt;: text goes to Copilot.</text>
  <circle class="badge" cx="606" cy="604" r="14"/><text class="bn" x="606" y="610">4</text>
  <text class="t" x="630" y="610">/exit returns you to your shell (panel 1).</text>
  <text class="tb" x="584" y="656">Typical here</text>
  <text class="t" x="584" y="684">/agent, /skills, /instructions, /env, /diagnose</text>
  <text class="tm" x="584" y="710">Typed here, cat or dotnet is chat text, not a command.</text>

  <!-- Panel 3: VS Code -->
  <rect class="panel" x="1080" y="120" width="480" height="610" rx="14"/>
  <rect x="1080" y="120" width="480" height="8" rx="4" fill="#58a6ff"/>
  <text class="h2" x="1104" y="166">💠 In VS Code</text>
  <text class="sub" x="1104" y="196">Editor and Copilot Chat</text>
  <line class="sep" x1="1080" y1="212" x2="1560" y2="212"/>
  <rect class="win" x="1104" y="228" width="432" height="300" rx="8"/>
  <rect x="1104" y="228" width="432" height="30" rx="8" fill="#161b22"/>
  <rect x="1110" y="232" width="214" height="26" rx="4" fill="#0b0f14" stroke="#58a6ff"/>
  <text class="tm" x="1122" y="251">dotnet-dev.agent.md</text>
  <text class="ms" x="1124" y="290"><tspan class="cm">---</tspan></text>
  <text class="ms" x="1124" y="314"><tspan class="pb">name:</tspan> "dotnet-dev"</text>
  <text class="ms" x="1124" y="338"><tspan class="pb">description:</tspan> "..."</text>
  <text class="ms" x="1124" y="362"><tspan class="pb">tools:</tspan> ["read", "edit"]</text>
  <text class="ms" x="1124" y="386"><tspan class="cm">---</tspan></text>
  <line class="sep" x1="1104" y1="404" x2="1536" y2="404"/>
  <text class="tm" x="1124" y="428">Copilot Chat</text>
  <rect x="1122" y="438" width="190" height="30" rx="15" fill="#10233f" stroke="#58a6ff" stroke-width="2"/>
  <text class="ms" x="1138" y="459">dotnet-dev ▾</text>
  <rect x="1122" y="480" width="396" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text class="ms" x="1136" y="503">/create-dotnet-test for …</text>
  <circle class="badge" cx="1346" cy="245" r="14"/><text class="bn" x="1346" y="251">5</text>
  <circle class="badge" cx="1334" cy="453" r="14"/><text class="bn" x="1334" y="459">6</text>
  <circle class="badge" cx="1126" cy="566" r="14"/><text class="bn" x="1126" y="572">5</text>
  <text class="t" x="1150" y="572">Create and save .github/ files here.</text>
  <circle class="badge" cx="1126" cy="604" r="14"/><text class="bn" x="1126" y="610">6</text>
  <text class="t" x="1150" y="610">Pick an agent; type /skill-name in Chat.</text>
  <text class="tb" x="1104" y="656">Typical here</text>
  <text class="t" x="1104" y="684">Chat: Open Customizations</text>
  <text class="t" x="1104" y="710">Show Agent Debug Logs, Show Chat Debug View</text>

  <!-- Moving between surfaces -->
  <text class="tb" x="40" y="772">Moving between surfaces</text>
  <rect class="chip" x="40" y="790" width="270" height="62" rx="10" stroke="#3fb950"/>
  <text class="m" x="60" y="828"><tspan class="cm">🐚 </tspan><tspan class="pg">$ </tspan>copilot</text>
  <path d="M312 821 H388" stroke="#9da7b3" stroke-width="3" fill="none"/><path d="M388 821 l-12 -8 v16 z" fill="#9da7b3"/>
  <text class="tm" x="324" y="810">Enter</text>
  <rect class="chip" x="392" y="790" width="290" height="62" rx="10" stroke="#bc8cff"/>
  <text class="m" x="412" y="828"><tspan class="cm">🤖 </tspan><tspan class="pp">copilot&gt; </tspan>/exit</text>
  <path d="M684 821 H760" stroke="#9da7b3" stroke-width="3" fill="none"/><path d="M760 821 l-12 -8 v16 z" fill="#9da7b3"/>
  <text class="tm" x="694" y="810">/exit</text>
  <rect class="chip" x="764" y="790" width="216" height="62" rx="10" stroke="#3fb950"/>
  <text class="m" x="784" y="828"><tspan class="cm">🐚 </tspan><tspan class="pg">$ </tspan>_</text>

  <rect x="1020" y="772" width="540" height="100" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text class="tb" x="1040" y="806">The badge names what you type into.</text>
  <text class="t" x="1040" y="834">VS Code's integrated terminal is still a 🐚 shell;</text>
  <text class="t" x="1040" y="860">run copilot there and you are in 🤖 until /exit.</text>
</svg>
