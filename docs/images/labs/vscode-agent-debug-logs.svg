    .t{font:400 18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tb{font:700 18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tm{font:400 16px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .ts{font:400 14px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .m{font:500 17px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .ms{font:500 15px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .ev{font:600 16px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#79c0ff}
    .evg{font:600 16px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#d2a8ff}
    .big{font:700 30px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .badge{fill:#e3b341;stroke:#0d1117;stroke-width:2}
    .bn{font:700 17px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0d1117;text-anchor:middle}
    .chip{fill:#161b22;stroke:#30363d;stroke-width:2}
    .chipa{fill:#10233f;stroke:#58a6ff;stroke-width:2}
    .node{fill:#161b22;stroke:#58a6ff;stroke-width:2}
    .nodeg{fill:#161b22;stroke:#bc8cff;stroke-width:2}
    .nodee{fill:#2b1417;stroke:#f85149;stroke-width:2}
    .edge{stroke:#9da7b3;stroke-width:2.5;fill:none}
    .arrow{fill:#9da7b3}
  </style>

