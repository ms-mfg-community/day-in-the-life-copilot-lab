  <text class="t" x="880" y="1046">Export and Import: OTLP JSON.</text><text class="t" x="880" y="1070">Review it before you share it</text>
  <circle class="badge" cx="1254" cy="1050" r="14"/><text class="bn" x="1254" y="1056">8</text>
  <text class="t" x="1280" y="1046">Enable capture first: it is</text><text class="t" x="1280" y="1070">not retroactive</text>
</svg>
