  <circle class="badge" cx="278" cy="603" r="14"/><text class="bn" x="278" y="609">5</text>

  <!-- Capture settings and asking Copilot -->
  <rect class="card" x="1040" y="580" width="520" height="168" rx="10"/>
  <text class="tb" x="1062" y="612">Turn capture on before you reproduce</text>
  <text class="ts" x="1062" y="638">COPILOT HARNESS (AGENT HOST) SESSIONS</text>
  <text class="ms" x="1062" y="662">chat.agentHost.agentDebugLog.enabled</text>
  <text class="ts" x="1062" y="692">LOCAL HARNESS SESSIONS</text>
  <text class="ms" x="1062" y="716">github.copilot.chat.agentDebugLog.fileLogging.enabled</text>
  <text class="ts" x="1062" y="738">Both are experimental. Capture is not retroactive.</text>
  <circle class="badge" cx="1548" cy="592" r="14"/><text class="bn" x="1548" y="598">8</text>

  <rect class="card" x="1040" y="768" width="520" height="162" rx="10"/>
  <text class="tb" x="1062" y="800">Ask Copilot about the events (sparkle icon)</text>
  <text class="ms" x="1062" y="830">#debugEventsSnapshot which</text>
  <text class="ms" x="1062" y="852">customization files were loaded?</text>
  <text class="ms" x="1062" y="886">/troubleshoot Which customizations</text>
  <text class="ms" x="1062" y="908">were loaded, and did any fail?</text>

