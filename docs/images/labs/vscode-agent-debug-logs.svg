<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="debuglogs-title debuglogs-desc">
  <title id="debuglogs-title">VS Code Agent Debug Logs: Logs view, Summary view and Agent Flow Chart</title>
  <desc id="debuglogs-desc">A mock-up of the Agent Debug Logs panel in VS Code, which is in Preview. The Logs view lists events with a time, an event name and a summary. The first events of a request are the discovery cluster Load Instructions, Load Agents, Load Hooks and Load Skills; after them come an LLM Request and a Tool call. Selecting a row opens a detail panel on the right showing the paths searched and the skills found. A toolbar offers a List or Tree toggle, filters for Discovery, Model requests, Tool calls and Errors, and a sparkle icon that attaches the events to chat, plus Export and Import icons. A Summary view shows tiles for model turns, tool calls, total tokens, errors, total events and duration, with buttons for View Logs, Agent Flow Chart and Cache Explorer. The Agent Flow Chart shows a user prompt reaching a main agent, lab-orchestrator, which delegates to three subagents, dotnet-dev, dotnet-qa and code-reviewer, each calling a tool; one tool node is marked as an error to show where a workflow stopped. A settings box says capture is not retroactive and names the two capture settings, and a numbered legend explains eight callouts. Values are illustrative.</desc>
