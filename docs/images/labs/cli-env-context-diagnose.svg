<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="clienv-title clienv-desc">
  <title id="clienv-title">Copilot CLI session commands: /env, /instructions, /context and /diagnose</title>
  <desc id="clienv-desc">A terminal-style capture of four Copilot CLI slash commands typed inside a running copilot session. The /env pane lists the eight categories of loaded environment details: instructions, MCP servers, skills, agents, hooks, plugins, LSPs and extensions. The /instructions pane lists custom instruction files as checkboxes you can switch on or off, with one switched off. The /context pane shows a stacked bar of the context window split into seven parts: System Prompt, Custom Instructions, System Tools, MCP Tools, Messages, Free Space and Buffer, with a note that experimental mode adds usage per skill, subagent, MCP server, tool and plugin. The /diagnose pane shows the command with a prompt and a placeholder where the analysis of the current session's logs appears, including why a permission request needed approval. Four numbered callouts explain what each command answers. The layout and values are illustrative samples.</desc>
  <style>
    .bg{fill:#0d1117}
    .win{fill:#0b0f14;stroke:#30363d;stroke-width:2}
    .bar{fill:#161b22}
    .sep{stroke:#30363d;stroke-width:2}
    .h1{font:700 34px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .sub{font:400 20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .t{font:400 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tb{font:700 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tm{font:400 16px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .ts{font:400 14px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .m{font:500 17px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .mm{font:500 16px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#9da7b3}
    .mv{font:500 16px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .pp{fill:#bc8cff}
    .ok{fill:#3fb950}
    .off{fill:#8b949e}
    .badge{fill:#e3b341;stroke:#0d1117;stroke-width:2}
    .bn{font:700 17px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0d1117;text-anchor:middle}
  </style>

  <rect class="bg" width="1600" height="1000"/>
  <text class="h1" x="40" y="62">🤖 Copilot CLI: /env, /instructions, /context, /diagnose</text>
  <text class="sub" x="40" y="96">Type these inside a running copilot session, not at your shell prompt. Layout and values are samples.</text>

  <!-- Pane 1: /env -->
  <rect class="win" x="40" y="124" width="740" height="372" rx="12"/>
  <rect class="bar" x="40" y="124" width="740" height="36" rx="12"/><rect class="bar" x="40" y="148" width="740" height="12"/>
  <circle cx="62" cy="142" r="5" fill="#f85149"/><circle cx="80" cy="142" r="5" fill="#d29922"/><circle cx="98" cy="142" r="5" fill="#3fb950"/>
  <text class="tm" x="120" y="147">copilot session</text>
  <text class="m" x="64" y="194"><tspan class="pp">copilot&gt; </tspan>/env</text>
  <text class="mm" x="64" y="232">Instructions</text><text class="mv" x="236" y="232">AGENTS.md, copilot-instructions.md, ...</text>
  <text class="mm" x="64" y="264">MCP servers</text><text class="mv" x="236" y="264">context7, microsoft-learn, ...</text>
  <text class="mm" x="64" y="296">Skills</text><text class="mv" x="236" y="296">commit, dotnet-testing, ...</text>
  <text class="mm" x="64" y="328">Agents</text><text class="mv" x="236" y="328">planner, code-reviewer, ...</text>
  <text class="mm" x="64" y="360">Hooks</text><text class="mv" x="236" y="360">userPromptSubmitted, preToolUse, ...</text>
  <text class="mm" x="64" y="392">Plugins</text><text class="mv" x="236" y="392">(none)</text>
  <text class="mm" x="64" y="424">LSPs</text><text class="mv" x="236" y="424">(none)</text>
  <text class="mm" x="64" y="456">Extensions</text><text class="mv" x="236" y="456">(none)</text>
  <text class="ts" x="64" y="482">Shows loaded environment details: the eight categories above.</text>
  <circle class="badge" cx="756" cy="192" r="14"/><text class="bn" x="756" y="198">1</text>

  <!-- Pane 2: /instructions -->
  <rect class="win" x="820" y="124" width="740" height="372" rx="12"/>
  <rect class="bar" x="820" y="124" width="740" height="36" rx="12"/><rect class="bar" x="820" y="148" width="740" height="12"/>
  <circle cx="842" cy="142" r="5" fill="#f85149"/><circle cx="860" cy="142" r="5" fill="#d29922"/><circle cx="878" cy="142" r="5" fill="#3fb950"/>
  <text class="tm" x="900" y="147">copilot session</text>
  <text class="m" x="844" y="194"><tspan class="pp">copilot&gt; </tspan>/instructions</text>
  <text class="mv" x="844" y="240"><tspan class="ok">[x]</tspan> AGENTS.md</text>
  <text class="mv" x="844" y="276"><tspan class="ok">[x]</tspan> .github/copilot-instructions.md</text>
  <text class="mv" x="844" y="312"><tspan class="ok">[x]</tspan> .github/instructions/dotnet.instructions.md</text>
  <text class="mv" x="844" y="348"><tspan class="ok">[x]</tspan> .github/instructions/razor-views.instructions.md</text>
  <text class="mv" x="844" y="384"><tspan class="off">[ ] .github/instructions/lessons.instructions.md</tspan></text>
  <text class="mm" x="1470" y="384" text-anchor="end">off</text>
  <text class="ts" x="844" y="430">Views and toggles the custom instruction files Copilot found.</text>
  <text class="ts" x="844" y="454">A file you switch off is not included in the session.</text>
  <circle class="badge" cx="1536" cy="192" r="14"/><text class="bn" x="1536" y="198">2</text>

  <!-- Pane 3: /context -->
  <rect class="win" x="40" y="516" width="740" height="372" rx="12"/>
  <rect class="bar" x="40" y="516" width="740" height="36" rx="12"/><rect class="bar" x="40" y="540" width="740" height="12"/>
  <circle cx="62" cy="534" r="5" fill="#f85149"/><circle cx="80" cy="534" r="5" fill="#d29922"/><circle cx="98" cy="534" r="5" fill="#3fb950"/>
  <text class="tm" x="120" y="539">copilot session</text>
  <text class="m" x="64" y="586"><tspan class="pp">copilot&gt; </tspan>/context</text>
  <text class="ts" x="64" y="612">CONTEXT WINDOW FOR THE CURRENT MODEL (SAMPLE SHARES)</text>
  <rect x="64" y="624" width="42" height="34" fill="#58a6ff"/>
  <rect x="106" y="624" width="28" height="34" fill="#bc8cff"/>
  <rect x="134" y="624" width="62" height="34" fill="#3fb950"/>
  <rect x="196" y="624" width="48" height="34" fill="#d29922"/>
  <rect x="244" y="624" width="83" height="34" fill="#f778ba"/>
  <rect x="327" y="624" width="346" height="34" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="673" y="624" width="83" height="34" fill="#6e7681"/>
  <rect x="64" y="680" width="14" height="14" fill="#58a6ff"/><text class="mv" x="88" y="693">System Prompt</text><text class="mm" x="300" y="693" text-anchor="end">6%</text>
  <rect x="64" y="708" width="14" height="14" fill="#bc8cff"/><text class="mv" x="88" y="721">Custom Instructions</text><text class="mm" x="300" y="721" text-anchor="end">4%</text>
  <rect x="64" y="736" width="14" height="14" fill="#3fb950"/><text class="mv" x="88" y="749">System Tools</text><text class="mm" x="300" y="749" text-anchor="end">9%</text>
  <rect x="64" y="764" width="14" height="14" fill="#d29922"/><text class="mv" x="88" y="777">MCP Tools</text><text class="mm" x="300" y="777" text-anchor="end">7%</text>
  <rect x="420" y="680" width="14" height="14" fill="#f778ba"/><text class="mv" x="444" y="693">Messages</text><text class="mm" x="700" y="693" text-anchor="end">12%</text>
  <rect x="420" y="708" width="14" height="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text class="mv" x="444" y="721">Free Space</text><text class="mm" x="700" y="721" text-anchor="end">50%</text>
  <rect x="420" y="736" width="14" height="14" fill="#6e7681"/><text class="mv" x="444" y="749">Buffer</text><text class="mm" x="700" y="749" text-anchor="end">12%</text>
  <text class="ts" x="420" y="777">Buffer: room reserved for the reply and compaction.</text>
  <text class="ts" x="64" y="816">Experimental mode adds usage per skill, subagent, MCP server,</text>
  <text class="ts" x="64" y="838">tool and plugin, and the largest messages.</text>
  <circle class="badge" cx="756" cy="584" r="14"/><text class="bn" x="756" y="590">3</text>

  <!-- Pane 4: /diagnose -->
  <rect class="win" x="820" y="516" width="740" height="372" rx="12"/>
  <rect class="bar" x="820" y="516" width="740" height="36" rx="12"/><rect class="bar" x="820" y="540" width="740" height="12"/>
  <circle cx="842" cy="534" r="5" fill="#f85149"/><circle cx="860" cy="534" r="5" fill="#d29922"/><circle cx="878" cy="534" r="5" fill="#3fb950"/>
  <text class="tm" x="900" y="539">copilot session</text>
  <text class="m" x="844" y="586"><tspan class="pp">copilot&gt; </tspan>/diagnose Why did that tool call</text>
  <text class="m" x="844" y="612">ask me for approval?</text>
  <text class="mm" x="844" y="660">Analyzing the current session's logs ...</text>
  <rect x="844" y="680" width="692" height="92" rx="8" fill="#11161d" stroke="#30363d" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="mm" x="864" y="712">&lt;the analysis appears here: what the logs show,</text>
  <text class="mm" x="864" y="738">including why a permission request needed approval&gt;</text>
  <text class="ts" x="844" y="810">Usage: /diagnose [prompt]. Run it alone for a general look, or add a question.</text>
  <text class="ts" x="844" y="834">Compare its answer with the session's own logs when the answer matters.</text>
  <circle class="badge" cx="1536" cy="584" r="14"/><text class="bn" x="1536" y="590">4</text>

  <!-- Legend -->
  <circle class="badge" cx="54" cy="928" r="14"/><text class="bn" x="54" y="934">1</text>
  <text class="t" x="80" y="934">What loaded: instructions, MCP servers, skills, agents, hooks ...</text>
  <circle class="badge" cx="820" cy="928" r="14"/><text class="bn" x="820" y="934">2</text>
  <text class="t" x="846" y="934">Which instruction files are on, and switch them off or on</text>
  <circle class="badge" cx="54" cy="968" r="14"/><text class="bn" x="54" y="974">3</text>
  <text class="t" x="80" y="974">What the context window holds, and how much room is left</text>
  <circle class="badge" cx="820" cy="968" r="14"/><text class="bn" x="820" y="974">4</text>
  <text class="t" x="846" y="974">Ask Copilot to analyze the session logs, permission requests included</text>
</svg>
