<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chatdebug-title chatdebug-desc">
  <title id="chatdebug-title">VS Code Chat Debug View: System prompt, User prompt, Context, Response and Tool responses</title>
  <desc id="chatdebug-desc">A mock-up of the Chat Debug View in VS Code, opened with Show Chat Debug View from the Chat view overflow menu or Developer: Show Chat Debug View. A sidebar lists the model requests of a session grouped by agent, with Request 2 selected. The main area shows the selected request as five expandable sections: System prompt, shown expanded with a short excerpt that points to the instruction files and the agent definition, then User prompt, Context, Response and Tool responses, collapsed. A numbered column says what to check in each section: that expected instructions and agent definitions appear, that the prompt text and references are present, that the needed files and symbols are present, whether the response is complete or an error, and whether each tool got the expected input and returned a usable result. A box repeats the two ways to open the view. A bottom strip gives three checks in order: Discovery, Inclusion and Adherence, and a note says included is not the same as followed. The content is illustrative.</desc>
  <style>
    .bg{fill:#0d1117}
    .win{fill:#0b0f14;stroke:#30363d;stroke-width:2}
    .bar{fill:#161b22}
    .card{fill:#161b22;stroke:#30363d;stroke-width:2}
    .sep{stroke:#30363d;stroke-width:2}
    .h1{font:700 34px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .h2{font:700 26px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .sub{font:400 20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .t{font:400 18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tb{font:700 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
    .tm{font:400 16px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .ts{font:400 14px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9da7b3}
    .m{font:500 17px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .ms{font:500 15px ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#e6edf3}
    .sec{font:700 19px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#79c0ff}
    .badge{fill:#e3b341;stroke:#0d1117;stroke-width:2}
    .bn{font:700 17px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0d1117;text-anchor:middle}
    .arrow{fill:#9da7b3}
  </style>

  <rect class="bg" width="1600" height="900"/>
  <text class="h1" x="40" y="62">💠 VS Code: Show Chat Debug View</text>
  <text class="sub" x="40" y="96">The exact request that reached the model, one expandable section at a time.</text>

  <!-- Window -->
  <rect class="win" x="40" y="120" width="1000" height="600" rx="12"/>
  <rect class="bar" x="40" y="120" width="1000" height="40" rx="12"/><rect class="bar" x="40" y="148" width="1000" height="12"/>
  <rect x="52" y="126" width="190" height="34" rx="6" fill="#0b0f14" stroke="#58a6ff" stroke-width="2"/>
  <text class="tm" x="68" y="149">Chat Debug</text>
  <line class="sep" x1="300" y1="160" x2="300" y2="720"/>

  <!-- Sidebar -->
  <text class="ts" x="64" y="192">REQUESTS, GROUPED BY AGENT</text>
  <text class="tb" x="64" y="228">Main agent</text>
  <text class="tm" x="84" y="262">Request 1</text><text class="ts" x="214" y="262">10:42:04</text>
  <rect x="52" y="274" width="236" height="40" rx="6" fill="#10233f" stroke="#58a6ff" stroke-width="2"/>
  <text class="tb" x="84" y="301" style="fill:#79c0ff">Request 2</text><text class="ts" x="214" y="301">10:42:09</text>
  <text class="tm" x="84" y="342">Request 3</text><text class="ts" x="214" y="342">10:42:15</text>
  <text class="tb" x="64" y="394">Subagent: dotnet-qa</text>
  <text class="tm" x="84" y="428">Request 4</text><text class="ts" x="214" y="428">10:42:21</text>

  <!-- Selected request -->
  <text class="tb" x="324" y="196">Request 2</text><text class="tm" x="418" y="196">chat, main agent (sample request)</text>

  <rect class="card" x="324" y="214" width="696" height="206" rx="8"/>
  <text class="sec" x="344" y="244">▾  System prompt</text>
  <line class="sep" x1="324" y1="256" x2="1020" y2="256"/>
  <text class="ms" x="344" y="286">... rules from .github/copilot-instructions.md ...</text>
  <text class="ms" x="344" y="312">... project notes from AGENTS.md ...</text>
  <text class="ms" x="344" y="338">... instructions whose applyTo matches ...</text>
  <text class="ms" x="344" y="364">... the selected agent's definition ...</text>
  <text class="ts" x="344" y="402">Excerpt for illustration: the real prompt is much longer.</text>

  <rect class="card" x="324" y="432" width="696" height="46" rx="8"/>
  <text class="sec" x="344" y="462">▸  User prompt</text><text class="tm" x="1000" y="461" text-anchor="end">Add a student search page</text>
  <rect class="card" x="324" y="490" width="696" height="46" rx="8"/>
  <text class="sec" x="344" y="520">▸  Context</text><text class="tm" x="1000" y="519" text-anchor="end">files, symbols, attachments</text>
  <rect class="card" x="324" y="548" width="696" height="46" rx="8"/>
  <text class="sec" x="344" y="578">▸  Response</text><text class="tm" x="1000" y="577" text-anchor="end">what the model returned</text>
  <rect class="card" x="324" y="606" width="696" height="46" rx="8"/>
  <text class="sec" x="344" y="636">▸  Tool responses</text><text class="tm" x="1000" y="635" text-anchor="end">tool inputs and outputs</text>
  <text class="ts" x="324" y="684">Select a section to expand or collapse it.</text>

  <circle class="badge" cx="1024" cy="236" r="14"/><text class="bn" x="1024" y="242">1</text>
  <circle class="badge" cx="1024" cy="455" r="14"/><text class="bn" x="1024" y="461">2</text>
  <circle class="badge" cx="1024" cy="513" r="14"/><text class="bn" x="1024" y="519">3</text>
  <circle class="badge" cx="1024" cy="571" r="14"/><text class="bn" x="1024" y="577">4</text>
  <circle class="badge" cx="1024" cy="629" r="14"/><text class="bn" x="1024" y="635">5</text>

  <!-- What to check -->
  <text class="h2" x="1080" y="156">What to check</text>
  <circle class="badge" cx="1094" cy="196" r="14"/><text class="bn" x="1094" y="202">1</text>
  <text class="tb" x="1120" y="196">System prompt</text><text class="tm" x="1120" y="220">Expected instructions and agent definitions.</text>
  <circle class="badge" cx="1094" cy="262" r="14"/><text class="bn" x="1094" y="268">2</text>
  <text class="tb" x="1120" y="262">User prompt</text><text class="tm" x="1120" y="286">Prompt text and resolved references.</text>
  <circle class="badge" cx="1094" cy="328" r="14"/><text class="bn" x="1094" y="334">3</text>
  <text class="tb" x="1120" y="328">Context</text><text class="tm" x="1120" y="352">The files and symbols the task needs.</text>
  <circle class="badge" cx="1094" cy="394" r="14"/><text class="bn" x="1094" y="400">4</text>
  <text class="tb" x="1120" y="394">Response</text><text class="tm" x="1120" y="418">Complete content, or an error?</text>
  <circle class="badge" cx="1094" cy="460" r="14"/><text class="bn" x="1094" y="466">5</text>
  <text class="tb" x="1120" y="460">Tool responses</text><text class="tm" x="1120" y="484">Expected input in, usable result out.</text>

  <rect class="card" x="1070" y="520" width="490" height="200" rx="10"/>
  <text class="tb" x="1092" y="554">Open it</text>
  <text class="tm" x="1092" y="584">Chat view overflow menu:</text>
  <text class="m" x="1092" y="610">Show Chat Debug View</text>
  <text class="tm" x="1092" y="648">Or from the Command Palette:</text>
  <text class="m" x="1092" y="674">Developer: Show Chat Debug View</text>
  <text class="ts" x="1092" y="702">Turn Agent Debug Logs capture on first if you want events too.</text>

  <!-- Three checks -->
  <text class="tb" x="40" y="762">Three checks, in this order</text>
  <rect class="card" x="40" y="778" width="316" height="102" rx="10" style="stroke:#58a6ff"/>
  <text class="tb" x="60" y="808" style="fill:#79c0ff">Discovery</text>
  <text class="tm" x="60" y="834">Is the file listed, and is it</text><text class="tm" x="60" y="858">free of errors?</text>
  <path d="M358 829 h10 l-1 -7 l12 7 l-12 7 l1 -7 z" class="arrow"/>
  <rect class="card" x="382" y="778" width="316" height="102" rx="10" style="stroke:#bc8cff"/>
  <text class="tb" x="402" y="808" style="fill:#d2a8ff">Inclusion</text>
  <text class="tm" x="402" y="834">Is its text in the System</text><text class="tm" x="402" y="858">prompt or the Context?</text>
  <path d="M700 829 h10 l-1 -7 l12 7 l-12 7 l1 -7 z" class="arrow"/>
  <rect class="card" x="724" y="778" width="316" height="102" rx="10" style="stroke:#3fb950"/>
  <text class="tb" x="744" y="808" style="fill:#56d364">Adherence</text>
  <text class="tm" x="744" y="834">Does the answer follow it?</text><text class="tm" x="744" y="858">Look for conflicting rules.</text>

  <rect x="1070" y="740" width="490" height="140" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text class="tb" x="1092" y="772">Included is not the same as followed.</text>
  <text class="t" x="1092" y="802">If the text reached the model and the</text>
  <text class="t" x="1092" y="828">answer still ignores it, look for</text>
  <text class="t" x="1092" y="854">conflicting or unclear guidance.</text>
</svg>
