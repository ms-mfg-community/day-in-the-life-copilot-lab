# Enterprise AI governance policy this registry assumes labs teach against.
# Confirmed via https://github.blog/changelog/2026-07-29-default-model-enablement-for-copilot-business-and-enterprise/ :
# rollout began 2026-08-26, enforced org-wide by 2026-09-01. Any newly-GA
# model an admin has NOT explicitly configured is now available to users by
# default org-wide (a change from the prior implicit-hold behavior). Admins
# who want the old curated-allowlist behavior must explicitly disable the
# global "default availability" policy. Labs 14, 17, and 20 reference this.
model_default_availability_policy: "default-on-unless-disabled"

# Enterprise-managed settings. Confirmed via
# https://github.blog/changelog/2026-07-01-enterprise-managed-settings-json-is-generally-available/
# (fetched directly). The supported path is copilot/managed-settings.json in
# the enterprise's chosen source organization's .github-private repo, with
# backward compatibility for the older .github/copilot/settings.json path.
# Configured via the AI Controls tab in enterprise settings. The supported-key
# list below is authoritative for the labs; retain dotted paths for nested keys.
enterprise_managed_settings:
  canonical_path: "copilot/managed-settings.json"
  legacy_path: ".github/copilot/settings.json"
  source_repo_pattern: ".github-private"
  # Verified against the published schema reference:
  # https://docs.github.com/en/enterprise-cloud@latest/copilot/reference/enterprise-administrators/enterprise-managed-settings
  # The 2026-07-01 GA changelog announced five keys; the schema has grown
  # since. GitHub states "additional keys will be continuously added over
  # time" — treat this as a floor and re-check on the last_verified date.
  supported_keys:
    - extraKnownMarketplaces
    - enabledPlugins
    - strictKnownMarketplaces
    - model
    - autoTier # requires CLI >=1.0.87-0, VS Code >=1.140.0
    - permissions.disableBypassPermissionsMode
    - permissions.deny
    - permissions.ask
    - permissions.allow
    - allowedMcpServers
    - deniedMcpServers
    - sandbox
    - telemetry
    - remoteControl
  # Highest-precedence first. sandbox and permissions.deny/.ask/.allow are
  # the exception: they compose most-restrictively across delivery methods.
  # disableBypassPermissionsMode is NOT in that exception list.
  precedence_order:
    - mdm-managed
    - server-managed
    - file-based
    - user-level
  team_overrides:
    deployment: server-managed-only
    mappings_path: "copilot/team-mappings.json"
    settings_directory: "copilot/teams"
    merge_rule: least-restrictive
    additive_keys:
      - enabledPlugins
    non_overridable_keys:
      - telemetry
  strict_known_marketplaces_ga_date: "2026-07-01" # public preview: 2026-06-25
  last_verified: "2026-10-01"

