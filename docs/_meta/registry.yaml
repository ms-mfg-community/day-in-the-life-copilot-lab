# Day-in-the-Life Copilot Lab — Content Registry
#
# Single source of truth for versions, services, and pacing that appear across
# labs, workflows, and CI. The Phase 4 weekly audit agent reads this file,
# compares against upstream sources, and opens a PR when drift is detected.
#
# Rules:
#   - Keep keys stable; the audit workflow matches on them.
#   - Labs that would otherwise hardcode a version MUST link to this file
#     (see tests/content-currency/registry-consumed.test.ts).
#   - Never place secrets here.

schema_version: 1

# Verified published on npm 2026-09-04: `npm view @github/copilot versions`
# lists 1.0.82 (published 2026-08-29); dist-tag `latest` was 1.0.83.
# Keep this at the LOWEST version the labs actually require, not `latest` —
# every learner is held to this floor by scripts/preflight.{sh,ps1}.
copilot_cli_version_floor: "1.0.82"

# The gh-aw compiler version the committed .lock.yml files were built with
# (see the `compiler_version` field in any .github/workflows/*.lock.yml).
# Recompiling with a different version rewrites the locks, so pin the
# extension to match before running `gh aw compile`:
#   gh extension install github/gh-aw --pin v0.86.2
# NOTE: weekly-content-audit.lock.yml is still on an older schema and has
# not been recompiled; upstream latest was v0.88.2 as of 2026-09-04.
gh_aw_schema_version: "0.86.2"

# GitHub Spec Kit (`github/spec-kit`) release the enterprise-harness arc
# (Labs 21-26) is authored and tested against. Labs MUST reference this key
# rather than hardcoding a version — the install command is
# `uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v<version>`.
#
# RE-VERIFICATION OBLIGATION (epic EPIC-001 Appendix A.3, item 1):
# Spec Kit releases every few days — 13 releases between 2026-08-21 and
# 2026-09-25, two of them within 26 hours of each other. Re-check the pinned
# version, the command list, and the Copilot integration layout before any
# cohort, and at the start of any work that consumes this key — do not trust
# last_verified without re-checking. Verified 2026-09-25 via
# `gh api repos/github/spec-kit/releases/latest`: v1.0.12, published
# 2026-09-25T17:48:57Z, not a prerelease. This SUPERSEDES v1.0.11 (published
# 2026-09-24, recorded earlier the same day while the EPIC-001 #51 spec was
# written), v1.0.10 (recorded 2026-09-23 by EPIC-001 #48), v1.0.9 (found
# 2026-09-22 while the #48 spec was written) and the v1.0.8 value recorded
# on 2026-09-17 in EPIC-001 and in issue #48's body.
#
# Re-verified 2026-09-28 for EPIC-001 #52 via
# `gh api "repos/github/spec-kit/releases?per_page=10"`: still v1.0.12, nothing
# newer, not a prerelease. (The ?per_page=10 form is used deliberately in
# preference to releases/latest, which excludes prereleases and so cannot
# establish "nothing newer" on its own.) The pin did not move. Three days
# without a release is NOT evidence the cadence has slowed — re-check before
# the next cohort and at the start of any work that consumes this key.
spec_kit_version: "1.0.12"
spec_kit_version_last_verified: "2026-09-28"

# MCP protocol revision this registry assumes labs teach against. The
# 2026-07-28 spec is a breaking revision (stateless handshake, no
# Mcp-Session-Id, server/discover RPC, subscriptions/listen replacing
# resources/subscribe, MRTR pattern replacing server-initiated
# sampling/elicitation/roots-list, required resultType field). See
# https://modelcontextprotocol.io/specification/2026-07-28/changelog
# Labs 05 and 10 explicitly teach against this revision; other labs that
# show raw MCP request/response shapes should not describe the retired
# 2025-11-25-era session handshake.
mcp_protocol_spec_version: "2026-07-28"

# MCP server pins — re-verified 2026-08-31 against npm registry and each
# server's own release notes, including compatibility with the 2026-07-28
# stateless MCP spec revision above. Floating `@latest` tags remain in the
# per-server `mcp-configs/*/individual/*.json` files for the weekly audit to
# detect drift; this registry records the *known-good* version.
mcp_servers:
  - name: context7
    transport: stdio
    pin: "2.2.1"
    npm_package: "@upstash/context7-mcp"
    last_verified: "2026-08-31"
  - name: memory
    transport: stdio
    pin: "2026.1.26"
    npm_package: "@modelcontextprotocol/server-memory"
    last_verified: "2026-08-31"
    note: >-
      Persistent memory is an application-layer convention (e.g. this repo's
      .copilot/lessons pattern), not a protocol-level session — the
      2026-07-28 MCP spec removed protocol sessions entirely. Cross-call
      state now uses explicit server-minted handles passed as ordinary tool
      arguments, not an implicit session.
  - name: sequential-thinking
    transport: stdio
    pin: "2025.12.18"
    npm_package: "@modelcontextprotocol/server-sequential-thinking"
    last_verified: "2026-08-31"
  - name: microsoft-learn
    transport: http
    pin: latest
  - name: workiq
    transport: stdio
    pin: "0.4.1"
    npm_package: "@microsoft/workiq"
    last_verified: "2026-08-31"
  - name: fabric
    transport: stdio
    pin: "1.1.0" # @microsoft/fabric-mcp (local/OSS variant) — GA 1.0.0 2026-04-14; 1.1.0 verified live 2026-06-15 (28 tools, server start --mode all)
    npm_package: "@microsoft/fabric-mcp"
    last_verified: "2026-06-15"
    note: >-
      This pin targets the LOCAL/open-source Fabric.Mcp.Server
      (github.com/microsoft/mcp/tree/main/servers/Fabric.Mcp.Server), used by
      Lab 12's offline/Codespaces path. A separate REMOTE "Fabric Core MCP
      Server" also exists (https://api.fabric.microsoft.com/v1/mcp/core,
      Entra ID auth + RBAC, public preview since 2026-03) for live-tenant
      work — Lab 12 should make explicit which variant each exercise uses.
  - name: filesystem
    transport: stdio
    pin: "2026.8.31"
    npm_package: "@modelcontextprotocol/server-filesystem"
    last_verified: "2026-09-08"
    note: "Prepared core only; restricted to this checkout's synthetic fixture directory."

# Azure Monitor / Log Analytics resource API versions for Lab 25 (EPIC-001 U5).
# Labs and Bicep MUST read these rather than hardcoding an apiVersion.
#
# RE-VERIFICATION OBLIGATION (epic EPIC-001 Appendix A.3, item 3): re-confirm
# against the ARM/Bicep template reference before any cohort. Verified
# 2026-09-23 against learn.microsoft.com/azure/templates/* and the Logs
# Ingestion API overview; all four values unchanged since 2026-09-22.
azure_monitor:
  # Microsoft.Insights/dataCollectionRules — newest dated version in the
  # reference version list. Unchanged since 2026-09-17.
  data_collection_rules_api_version: "2024-03-11"

  # Microsoft.Insights/dataCollectionEndpoints — "Latest" resource format
  # emits apiVersion '2024-03-11'. Unchanged since 2026-09-17.
  data_collection_endpoints_api_version: "2024-03-11"

  # Microsoft.OperationalInsights/workspaces/tables.
  # CHANGED 2026-09-22: a newer STABLE version (2026-03-01) has shipped and is
  # now what the "Latest" reference page emits. The previously-recorded
  # 2025-07-01 (EPIC-001, 2026-09-17) is superseded but NOT retired — it still
  # deploys. If 2026-03-01 introduces a property change that breaks Lab 25's
  # Bicep, fall back to 2025-07-01 and record why here.
  workspaces_tables_api_version: "2026-03-01"
  workspaces_tables_api_version_previous: "2025-07-01"

  # Logs Ingestion API data-plane POST:
  #   {Endpoint}/dataCollectionRules/{DCR-Immutable-ID}/streams/{Stream-Name}?api-version=...
  # This is a DATA-PLANE version and is NOT the same as the ARM versions above.
  # Unchanged since 2026-09-17.
  logs_ingestion_data_plane_api_version: "2023-01-01"

  last_verified: "2026-09-23"

